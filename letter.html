<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter | Thinking & Youth Addict</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<style>
     .letter-paper {
        background: #ffffff;
        padding: 2.5rem;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        border: 1px solid rgba(0,0,0,0.05);
        position: relative; /* 基準点 */
        min-height: 60vh; 
        /* overflow: hidden; はスタンプがはみ出さないように残しておく */
        overflow: hidden;
    }

     #stamp-canvas {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        pointer-events: none; 
        z-index: 5; 
    }

    /* スタンプ自体の見た目（絶対配置を強制） */
    .stamped-mark {
        position: absolute !important;
        display: block !important;
        z-index: 100;
        mix-blend-mode: multiply;
        transform-origin: center;
        /* 最初はちょっとデカくして、叩きつけるようなアニメーション */
        animation: stamp-motion 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes stamp-motion {
        0% { transform: scale(3); opacity: 0; filter: blur(2px); }
        100% { transform: scale(1) rotate(var(--rot)); opacity: 0.8; filter: blur(0); }
    }
        @media (min-width: 768px) {
            .letter-paper {
                padding: 4rem;
            }
        }
</style>
<script>
    async function loadComponent(id, file) {
        const response = await fetch(file);
        const text = await response.text();
        document.getElementById(id).innerHTML = text;
    }
    loadComponent('header-placeholder', 'header.html');
    loadComponent('footer-placeholder', 'footer.html');

    window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    
    // 1. カテゴリ(subject)の自動選択
    const subjectParam = urlParams.get('subject');
    if (subjectParam) {
        const selectElement = document.querySelector('select[name="subject"]');
        if (selectElement) selectElement.value = subjectParam;
    }

    // 2. 作品名(ref)をメッセージ欄に自動入力
    const refParam = urlParams.get('ref');
    if (refParam) {
        const messageElement = document.querySelector('textarea[name="message"]');
        if (messageElement) {
            messageElement.value = `作品「${refParam}」のようなイメージでの制作を希望します。\n\n` + messageElement.value;
        }
    }

    const letterPaper = document.querySelector('.letter-paper');
    if (letterPaper && !document.getElementById('stamp-canvas')) {
        const canvas = document.createElement('div');
        canvas.id = 'stamp-canvas';
        // HTMLの構造上、中身を邪魔しないように最初に追加
        letterPaper.prepend(canvas); 
    }
});

let stampCount = 0;

function playStampGimmick() {
    const canvas = document.getElementById('stamp-canvas');
    if (!canvas) {
        // もしキャンバスがなければその場で作る（念のため）
        const paper = document.querySelector('.letter-paper');
        if(paper) {
            const newCanvas = document.createElement('div');
            newCanvas.id = 'stamp-canvas';
            paper.prepend(newCanvas);
            return playStampGimmick(); // 再実行
        }
        return;
    }

    const mark = document.createElement('div');
    stampCount++;
    const isSecret = stampCount % 5 === 0;
    
    mark.className = `stamped-mark ${isSecret ? 'secret' : ''}`;
    
    const size = isSecret ? 100 : (Math.random() * 30 + 60); 
    mark.style.width = `${size}px`;
    mark.style.height = `${size}px`;
    
    const canvasW = canvas.offsetWidth;
    const canvasH = canvas.offsetHeight;
    const padding = 20;
    
    const randomX = Math.random() * (canvasW - size - padding * 2) + padding;
    const randomY = Math.random() * (canvasH - size - padding * 2) + padding;
    const randomRot = (Math.random() - 0.5) * 60;
    
    mark.style.left = `${randomX}px`;
    mark.style.top = `${randomY}px`;
    mark.style.setProperty('--rot', `${randomRot}deg`);
    
    const randomHue = Math.floor(Math.random() * 360);
    const color = isSecret ? '#ff4d4d' : `hsl(${randomHue}, 60%, 50%)`;
    const text = isSecret ? 'FOLLOW ME' : 'THANK YOU';
    
    mark.innerHTML = `
        <svg viewBox="0 0 100 100" width="100%" height="100%">
            <circle cx="50" cy="50" r="45" fill="none" stroke="${color}" stroke-width="2" 
                stroke-dasharray="${isSecret ? 'none' : '5 3'}" style="opacity: 0.5;"/>
            <text x="50" y="55" font-family="sans-serif" font-size="12" text-anchor="middle" 
                fill="${color}" font-weight="bold" style="letter-spacing: 0.5px; opacity: 0.8;">
                ${text}
            </text>
        </svg>
    `;

    if (isSecret) {
        mark.style.cursor = 'pointer';
        mark.style.pointerEvents = 'auto'; // シークレットだけ触れるように
        mark.onclick = (e) => {
            e.stopPropagation();
            window.open('[https://x.com/あなたのID](https://x.com/あなたのID)', '_blank');
        };
    }
    
    canvas.appendChild(mark);

    // 振動アニメーション
    const letterPaper = document.querySelector('.letter-paper');
    letterPaper.animate([
        { transform: 'translate(0, 0)' },
        { transform: 'translate(1px, 1px)' },
        { transform: 'translate(0, 0)' }
    ], { duration: 100 });
}
</script>
<body class="pt-24">

    <div class="stain top-[20%] left-[-5%] w-[300px] h-[300px]"></div>
    <div class="stain bottom-[5%] right-[-5%] w-[400px] h-[400px]"></div>

    <!-- Navigation -->
    <div id="header-placeholder"></div>

    <main class="max-w-4xl mx-auto px-8 py-16">
        <header class="mb-16 space-y-4">
            <h1 class="serif italic text-5xl tracking-tighter">Letter</h1>
            <p class="handwritten text-2xl text-indigo-400 rotate-[-1deg]">あなたの声を、届けてください。</p>
            <p class="text-[10px] uppercase tracking-[0.3em] text-gray-400 font-bold pt-4">Contact for illustration or theater</p>
        </header>

        <form action="https://formspree.io/f/xwlvanjp" method="POST" class="relative">
            <!-- 封筒の切手部分のようなデコレーション -->
            <div class="absolute -top-16 -right-4 hidden lg:block cursor-pointer hover:scale-110 transition-transform" 
                 onclick="playStampGimmick()">
            <div class="stamp scale-110">
            <div class="text-center">
            <i class="fas fa-feather-alt mb-2 opacity-50"></i><br>
            <span class="text-[8px]">PUSH ME</span>
            </div>
            </div>
            </div>
<input type="hidden" name="_next" value="https://sakashima11.github.io/thanks.html">

            <div class="letter-paper">
                <div class="space-y-10">
                    <div class="border-b border-gray-100 flex items-end py-2">
                        <label class="text-[10px] uppercase tracking-widest text-gray-400 w-24 shrink-0">Name</label>
                        <input type="text" name="name" placeholder="お名前" required>
                    </div>
                    
                    <div class="border-b border-gray-100 flex items-end py-2">
                        <label class="text-[10px] uppercase tracking-widest text-gray-400 w-24 shrink-0">Email</label>
                        <input type="email" name="email" placeholder="メールアドレス" required>
                    </div>

                    <div class="border-b border-gray-100 flex items-end py-2">
                        <label class="text-[10px] uppercase tracking-widest text-gray-400 w-24 shrink-0">Subject</label>
                        <select name="subject" class="bg-transparent text-sm w-full outline-none text-gray-600">
                            <option value="work">イラストのご依頼</option>
                            <option value="character">キャラクターデザイン</option>
                            <option value="other">その他</option>
                        </select>
                    </div>

                     <div class="py-2">
                        <label class="text-[10px] uppercase tracking-widest text-gray-400 block mb-6">Message</label>
                       <textarea name="message" id="message-input" placeholder="ここにメッセージを書いてください..." required 
                       class="w-full bg-transparent border-none outline-none focus:ring-0 leading-[2.5rem] py-0 min-h-[40vh]"></textarea>
                    </div>
                </div>
            </div>

            <div class="mt-12 flex flex-col md:flex-row items-center justify-between gap-8">
                <p class="text-[10px] text-gray-400 leading-relaxed max-w-sm">
                    ※イラストのご依頼の際は、納期やご予算の目安を併記いただけるとスムーズです。<br>
                    3日以内の返信を心がけています。
                </p>
                <button type="submit" class="submit-btn text-[10px] uppercase tracking-[0.4em] font-bold">
                    Send Letter
                </button>
            </div>
        </form>

        <!-- Decoration -->
        <div class="mt-24 relative hidden md:block">
            <div class="absolute left-0 handwritten text-gray-300 text-xl rotate-[-5deg]">
                waiting for your story...
            </div>
            <div class="absolute right-10 -top-10 opacity-10">
                <i class="fas fa-envelope-open-text text-[120px]"></i>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

</body>
</html>
