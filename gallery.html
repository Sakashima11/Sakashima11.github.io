        <!-- Pagination Controls -->
        <div id="pagination" class="mt-24 flex justify-center items-center gap-4">
         <button id="prev-btn" onclick="changePage(-1)" class="px-4 py-2 border border-gray-200 text-[10px] uppercase tracking-widest hover:bg-black hover:text-white disabled:opacity-30 disabled:cursor-not-allowed">Prev</button>
         <div id="page-numbers" class="flex gap-2">
         <!-- ここに数字ボタンが自動で入るぜ -->
         </div>
         <button id="next-btn" onclick="changePage(1)" class="px-4 py-2 border border-gray-200 text-[10px] uppercase tracking-widest hover:bg-black hover:text-white disabled:opacity-30 disabled:cursor-not-allowed">Next</button>
        </div>

    <div id="footer-placeholder"></div>

    <script>
      // --- 設定 ---
const itemsPerPage = 6; // 1ページに表示する枚数（増やしたくなったらここを変えるだけ！）
let currentPage = 1;
let currentFilter = 'all';

// コンポーネント読み込み
async function loadComponent(id, file) {
    try {
        const response = await fetch(file);
        const text = await response.text();
        document.getElementById(id).innerHTML = text;
    } catch (e) { console.error(e); }
}

// 絞り込み & ページネーション更新
function filterSelection(c) {
    currentFilter = c;
    currentPage = 1; // フィルターを変えたら1ページ目に戻す
    updateDisplay();
}

function updateDisplay() {
    const items = Array.from(document.getElementsByClassName("gallery-item"));
    const btns = document.getElementsByClassName("tag-btn");
    
    // 1. ボタンのスタイル更新
    for (let btn of btns) {
        btn.classList.remove("active");
        btn.classList.add("text-gray-500");
        if (btn.getAttribute("data-filter") === currentFilter) {
            btn.classList.add("active");
            btn.classList.remove("text-gray-500");
        }
    }

    // すべてのアイテムから隠すクラス（hidden-item）を一度リセット
    items.forEach(item => {
        item.classList.remove("hidden-item");
    });

    // 2. フィルターに合うアイテムだけを抽出
    const filteredItems = items.filter(item => {
        return currentFilter === "all" || item.classList.contains(currentFilter);
    });

    // 3. ページネーションの計算
    const totalPages = Math.ceil(filteredItems.length / itemsPerPage);
    const startIndex = (currentPage - 1) * itemsPerPage;
    const endIndex = startIndex + itemsPerPage;

    // 4. 全アイテムを一度隠してから、現在のページのアイテムだけ表示する
    items.forEach(item => {
        item.classList.add("hidden-item"); // 一旦全部隠す
    });

    filteredItems.forEach((item, index) => {
        if (index >= startIndex && index < endIndex) {
            item.classList.remove("hidden-item"); // 該当ページの分だけ表示する
        }
    });

    // 5. ページネーションUIの更新
    renderPagination(totalPages);
}
function renderPagination(totalPages) {
    const paginationArea = document.getElementById("pagination");
    const pageNumbers = document.getElementById("page-numbers");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");

    // 1ページ以下ならコントロール自体を隠す
    if (totalPages <= 1) {
        paginationArea.style.display = "none";
        return;
    }
    paginationArea.style.display = "flex";
    pageNumbers.innerHTML = "";

    // 数字ボタン生成
    for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.innerText = i;
        btn.className = `w-8 h-8 border border-gray-200 text-[10px] font-bold transition-all ${i === currentPage ? 'bg-black text-white border-black' : 'hover:bg-gray-50'}`;
        btn.onclick = () => { currentPage = i; updateDisplay(); window.scrollTo({top: 0, behavior: 'smooth'}); };
        pageNumbers.appendChild(btn);
    }

    prevBtn.disabled = (currentPage === 1);
    nextBtn.disabled = (currentPage === totalPages);
}

function changePage(step) {
    currentPage += step;
    updateDisplay();
    window.scrollTo({top: 0, behavior: 'smooth'});
}

// 初期実行
window.onload = () => {
    loadComponent('header-placeholder', 'header.html');
    loadComponent('footer-placeholder', 'footer.html');

    const urlParams = new URLSearchParams(window.location.search);
    const filter = urlParams.get('filter');
    if (filter) currentFilter = filter;

    updateDisplay(); // ここで初期表示を実行！
};

    </script>
