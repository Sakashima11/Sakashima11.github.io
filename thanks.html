<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Thinking & Youth Addict</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="flex items-center justify-center min-h-screen">

    <div class="stain top-0 left-0 w-[500px] h-[500px]"></div>
    <div class="stain bottom-0 right-0 w-[500px] h-[500px]"></div>

    <main class="text-center px-8 fade-in relative z-10">
        <div class="envelope-icon">
            <i class="fas fa-paper-plane animate-bounce"></i>
        </div>
        
        <h1 class="serif italic text-4xl md:text-6xl mb-6 tracking-tighter">Your letter has been sent.</h1>
        
        <p class="handwritten text-2xl text-indigo-400 mb-12">
            手紙を受け取りました。ありがとうございます。
        </p>

        <div class="space-y-8">
            <p class="text-[10px] uppercase tracking-[0.3em] text-gray-400 leading-relaxed">
                Thank you for sharing your thoughts with me.<br>
                I will get back to you soon.
            </p>
            
            <a href="index.html" class="inline-block border border-black px-12 py-4 text-[10px] uppercase tracking-[0.4em] font-bold hover:bg-black hover:text-white transition duration-500">
                Back to Archives
            </a>
        </div>

        <!-- 落書きのような装飾 -->
        <div class="absolute -bottom-32 left-1/2 -translate-x-1/2 opacity-20 pointer-events-none">
            <p class="handwritten text-8xl whitespace-nowrap">merci beaucoup.</p>
        </div>
    </main>

</body>
</html>
